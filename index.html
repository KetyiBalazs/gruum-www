<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="The Design Consistency Layer for Agents and Teams. Join the Gruum waitlist."
    />
    <meta name="theme-color" content="#f5f6f7" />
    <title>Coming soon — Gruum</title>
    <link rel="icon" href="/assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/posthog.js"></script>
  </head>
  <body class="coming-soon-body">
    <a class="skip-link" href="#main">Skip to content</a>

    <main id="main" class="coming-soon">
      <div class="coming-soon-stack">
        <div class="coming-soon-hero">
          <div class="coming-soon-lockup">
            <img
              class="coming-soon-mark"
              src="/assets/gruum-mark.svg"
              alt=""
              width="32"
              height="32"
            />
            <img
              class="coming-soon-wordmark"
              src="/assets/gruum-wordmark.svg"
              alt="Gruum"
              width="83.7616"
              height="19.7101"
            />
          </div>

          <div class="coming-soon-copy">
            <h1 class="headline-main">
              The Design Consistency Layer for Agents and Teams
            </h1>
            <p class="body-normal">
              Gruum keeps your design system in sync across Figma, code, and AI
              tools. So everyone building for your brand uses the same visual
              language.
            </p>
          </div>
        </div>

        <form
          class="coming-soon-form"
          data-source="index"
          action="#"
          method="post"
        >
          <label class="visually-hidden" for="waitlist-email"
            >E-mail address</label
          >
          <input
            class="body-small"
            id="waitlist-email"
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="E-mail address"
          />
          <button class="body-small" type="submit">Join the waitlist</button>
          <p class="coming-soon-thanks body-normal">You’re on the list.</p>
          <p class="coming-soon-error body-small">
            Couldn’t join the waitlist. Try again.
          </p>
        </form>
      </div>

      <p class="coming-soon-contact body-small">
        Contact: <a href="mailto:hello@ketyi.me">hello@ketyi.me</a>
      </p>
    </main>

    <script src="/waitlist.js"></script>
  </body>
</html>
