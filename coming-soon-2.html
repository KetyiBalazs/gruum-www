<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="The Design Consistency Layer for Agents and Teams. Join the Gruum waitlist."
    />
    <meta name="theme-color" content="#1B110F" />
    <title>Coming soon — Gruum</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wdth,wght@0,14..32,75..125,400;0,14..32,75..125,500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preload"
      href="assets/fonts/PPMonumentExtended-Regular.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css?v=19" />
  </head>
  <body class="coming-soon-body">
    <a class="skip-link" href="#main">Skip to content</a>

    <main id="main" class="coming-soon">
      <div class="coming-soon-stack">
        <div class="coming-soon-hero">
          <div class="coming-soon-lockup">
            <img
              class="coming-soon-mark"
              src="assets/gruum-mark-poster.svg"
              alt=""
              width="39.432"
              height="39.435"
            />
            <span class="coming-soon-wordmark">Gruum</span>
          </div>

          <div class="coming-soon-copy">
            <h1>The Design Consistency Layer for Agents and Teams</h1>
            <p>
              Gruum keeps your design system in sync across Figma, code, and AI tools.
              So everyone building for your brand uses the same visual language.
            </p>
          </div>
        </div>

        <form class="coming-soon-form" data-source="coming-soon-2" action="#" method="post">
          <label class="visually-hidden" for="waitlist-email">E-mail address</label>
          <input
            id="waitlist-email"
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="E-mail address"
          />
          <button type="submit">Join the waitlist</button>
          <p class="coming-soon-thanks">You’re on the list.</p>
          <p class="coming-soon-error">Couldn’t join the waitlist. Try again.</p>
        </form>
      </div>

      <p class="coming-soon-contact">
        Contact: <a href="mailto:hello@ketyi.me">hello@ketyi.me</a>
      </p>
    </main>

    <script src="waitlist.js"></script>
  </body>
</html>
